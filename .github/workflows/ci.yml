name: PyMason smoke and Constitution gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PyMason
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out accepted WPAI Constitution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MrWizard94-Compile/Agents-Constitution
          ref: 5d5aa0c79a9bcad095f58ebe315bf44adc94fbff
          path: constitution
          persist-credentials: false

      - name: Validate canonical source and tests
        working-directory: constitution
        run: |
          python3 tools/validate-source.py
          python3 -m unittest discover -s tests -v

      - name: Audit PyMason Constitution adoption
        run: python3 constitution/tools/check-adoption.py project

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: project/tests/package-lock.json

      - name: Install locked smoke dependencies
        working-directory: project/tests
        run: npm ci

      - name: Audit locked smoke dependencies
        working-directory: project/tests
        run: npm audit --audit-level=low

      - name: Install Chromium and system dependencies
        working-directory: project/tests
        run: npx playwright install --with-deps chromium

      - name: Run complete Blockly, browser, and Pyodide smoke suite
        working-directory: project
        run: npm test
